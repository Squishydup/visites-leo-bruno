name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Installer gitleaks (utilisé par le hook pre-commit local)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: ruff check . && ruff format --check .
      - run: pre-commit run --all-files
      - run: pytest --cov=app --cov-report=xml --cov-report=html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-py3.13
          path: htmlcov/
          retention-days: 7
